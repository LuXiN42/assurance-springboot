<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Détail sinistre')}"></head>

<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="page">
        <div th:replace="~{fragments/layout :: messages}"></div>

        <h1>
            Sinistre <span th:text="${sinistre.numeroSinistre}"></span>
        </h1>

        <div class="card">
            <p>
                Date :
                <span th:text="${sinistre.date}"></span>
                |
                Type :
                <span th:text="${sinistre.typeSinistre}"></span>
            </p>

            <p>
                Client :
                <span th:text="${sinistre.contrat.client.prenom+' '+sinistre.contrat.client.nom}"></span>
                |
                Contrat :
                <a th:href="@{/agent/contrats/{id}(id=${sinistre.contrat.id})}"
                   th:text="${sinistre.contrat.numeroContrat}"></a>
            </p>

            <p>
                Description :
                <span th:text="${sinistre.description}"></span>
            </p>

            <p>
                Estimé :
                <span th:text="${sinistre.montantEstime}"></span>
                |
                Indemnisation :
                <span th:text="${sinistre.montantIndemnisation}"></span>
                |
                Statut :
                <span th:text="${sinistre.statut}"></span>
            </p>
        </div>

        <h2>Modifier le statut</h2>

        <form method="post"
              th:action="@{/agent/sinistres/{id}/statut(id=${sinistre.id})}">
            <label>
                Statut
                <select name="statut">
                    <option th:each="s:${statuts}"
                            th:value="${s}"
                            th:selected="${sinistre.statut==s}"
                            th:text="${s}">
                    </option>
                </select>
            </label>

            <label>
                Montant d'indemnisation
                <input type="number"
                       min="0.01"
                       step="0.01"
                       name="montantIndemnisation"
                       th:value="${sinistre.montantIndemnisation}" />
            </label>

            <button class="btn">Enregistrer le statut</button>
        </form>

        <h2>Pièces justificatives</h2>

        <ul>
            <li th:each="p:${sinistre.pieces}"
                th:text="${p.nomOriginal+' — '+p.dateDepot}">
            </li>

            <li th:if="${#lists.isEmpty(sinistre.pieces)}">
                Aucune pièce jointe.
            </li>
        </ul>

        <h2>Commentaires</h2>

        <ul>
            <li th:each="c:${commentaires}">
                <b th:text="${c.auteur.prenom+' '+c.auteur.nom}"></b>
                —
                <span th:text="${c.dateCreation}"></span>

                <p th:text="${c.texte}"></p>
            </li>
        </ul>

        <form method="post"
              th:action="@{/agent/sinistres/{id}/commentaires(id=${sinistre.id})}">
            <label>
                Ajouter un commentaire
                <textarea name="texte" required maxlength="2000"></textarea>
            </label>

            <button class="btn">Ajouter</button>
        </form>
    </main>

<th:block th:replace="~{fragments/layout :: pied}"></th:block>
</body>

</html>
