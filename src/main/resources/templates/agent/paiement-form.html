<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Paiement')}"></head>

<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main>
        <div th:replace="~{fragments/layout :: messages}"></div>

        <h1>Enregistrer un paiement</h1>

        <form method="post" th:action="@{/agent/paiements/enregistrer}">
            <label>
                Contrat
                <select name="contratId" required>
                    <option value="">Choisir</option>
                    <option th:each="c:${contrats}"
                            th:value="${c.id}"
                            th:text="${c.numeroContrat+' — '+c.client.prenom+' '+c.client.nom}">
                    </option>
                </select>
            </label>

            <label>
                Montant
                <input type="number"
                       min="0.01"
                       step="0.01"
                       name="montant"
                       required />
            </label>

            <label>
                Date
                <input type="date" name="date" />
            </label>

            <label>
                Mode
                <select name="mode">
                    <option value="">Choisir</option>
                    <option th:each="m:${modes}"
                            th:value="${m}"
                            th:text="${m}">
                    </option>
                </select>
            </label>

            <label>
                Statut
                <select name="statut">
                    <option th:each="s:${statuts}"
                            th:value="${s}"
                            th:text="${s}">
                    </option>
                </select>
            </label>

            <button class="btn">Enregistrer</button>
        </form>
    </main>

    <script
        type="module"
        src="https://static.cloudflareinsights.com/beacon.min.js/vce701823e78c4301a35b7e07294d87301792088814092"
        integrity="sha512-UKNk8GbxkABxKcXYuLkO16EleLGUkcvJWtpSNmExE0Too3ZaFAxTscNWEc1OdAv5/BikHawapSCaiD2XCmp+Bw=="
        data-cf-beacon='{"version":"2024.11.0","token":"8607d2a720d14b038279025b2b5a82e5","spa":2}'
        crossorigin="anonymous">
    </script>
</body>

</html>
