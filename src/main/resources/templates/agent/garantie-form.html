<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Garantie')}"></head>

<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="page">
        <div th:replace="~{fragments/layout :: messages}"></div>

        <h1 th:text="${garantie.id==null?'Créer une garantie':'Modifier une garantie'}"></h1>

        <form method="post" th:action="@{/agent/garanties/enregistrer}">
            <input type="hidden" name="id" th:value="${garantie.id}" />

            <label>
                Nom
                <input name="nom"
                       required
                       maxlength="150"
                       th:value="${garantie.nom}" />
            </label>

            <label>
                Description
                <textarea name="description"
                          maxlength="2000"
                          th:text="${garantie.description}"></textarea>
            </label>

            <button class="btn">Enregistrer</button>
            <a th:href="@{/agent/garanties}">Annuler</a>
        </form>
    </main>

<th:block th:replace="~{fragments/layout :: pied}"></th:block>
</body>

</html>
