<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Garantie')}"></head>

<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main>
        <div th:replace="~{fragments/layout :: messages}"></div>

        <h1 th:text="${garantie.id==null?'Créer une garantie':'Modifier une garantie'}"></h1>

        <form method="post" th:action="@{/agent/garanties/enregistrer}">
            <input type="hidden" name="id" th:value="${garantie.id}" />

            <label>
                Nom
                <input name="nom"
                       required
                       maxlength="150"
                       th:value="${garantie.nom}" />
            </label>

            <label>
                Description
                <textarea name="description"
                          maxlength="2000"
                          th:text="${garantie.description}"></textarea>
            </label>

            <button class="btn">Enregistrer</button>
            <a th:href="@{/agent/garanties}">Annuler</a>
        </form>
    </main>

    <script
        type="module"
        src="https://static.cloudflareinsights.com/beacon.min.js/vce701823e78c4301a35b7e07294d87301792088814092"
        integrity="sha512-UKNk8GbxkABxKcXYuLkO16EleLGUkcvJWtpSNmExE0Too3ZaFAxTscNWEc1OdAv5/BikHawapSCaiD2XCmp+Bw=="
        data-cf-beacon='{"version":"2024.11.0","token":"8607d2a720d14b038279025b2b5a82e5","spa":2}'
        crossorigin="anonymous">
    </script>
</body>

</html>
