
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Détail client')}"></head>

<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="page">
        <div th:replace="~{fragments/layout :: messages}"></div>

        <h1 th:text="${client.prenom+' '+client.nom}"></h1>

        <div class="card">
            <p>
                Email :
                <span th:text="${client.email}"></span>
            </p>

            <p>
                Téléphone :
                <span th:text="${client.telephone}"></span>
            </p>

            <p>
                Adresse :
                <span th:text="${client.adresse}"></span>
            </p>
        </div>

        <h2>Contrats</h2>

        <table>
            <tr>
                <th>Numéro</th>
                <th>Type</th>
                <th>Statut</th>
                <th>Détail</th>
            </tr>

            <tr th:each="c:${contrats}">
                <td th:text="${c.numeroContrat}"></td>
                <td th:text="${c.typeAssurance.nom}"></td>
                <td th:text="${c.statut}"></td>
                <td>
                    <a th:href="@{/agent/contrats/{id}(id=${c.id})}">Voir</a>
                </td>
            </tr>
        </table>

        <h2>Sinistres</h2>

        <table>
            <tr>
                <th>Numéro</th>
                <th>Date</th>
                <th>Statut</th>
                <th>Détail</th>
            </tr>

            <tr th:each="s:${sinistres}">
                <td th:text="${s.numeroSinistre}"></td>
                <td th:text="${s.date}"></td>
                <td th:text="${s.statut}"></td>
                <td>
                    <a th:href="@{/agent/sinistres/{id}(id=${s.id})}">Voir</a>
                </td>
            </tr>
        </table>

        <h2>Paiements</h2>

        <table>
            <tr>
                <th>Date</th>
                <th>Contrat</th>
                <th>Montant</th>
                <th>Statut</th>
            </tr>

            <tr th:each="p:${paiements}">
                <td th:text="${p.date}"></td>
                <td th:text="${p.contrat.numeroContrat}"></td>
                <td th:text="${p.montant}"></td>
                <td th:text="${p.statut}"></td>
            </tr>
        </table>
    </main>

<th:block th:replace="~{fragments/layout :: pied}"></th:block>
</body>

</html>
