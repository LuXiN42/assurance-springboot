<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Clients')}"></head>

<body>

    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="page">

        <div th:replace="~{fragments/layout :: messages}"></div>

        <h1>Clients</h1>

        <table>
            <thead>
                <tr>
                    <th>Nom</th>
                    <th>Email</th>
                    <th>Téléphone</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="client : ${clients}">
                    <td th:text="${client.prenom+' '+client.nom}"></td>
                    <td th:text="${client.email}"></td>
                    <td th:text="${client.telephone}"></td>
                    <td>
                        <a th:href="@{/agent/clients/{id}(id=${client.id})}">
                            Détail
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>

    </main>


<th:block th:replace="~{fragments/layout :: pied}"></th:block>
</body>

</html>
