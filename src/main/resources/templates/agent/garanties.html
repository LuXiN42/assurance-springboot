<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Garanties')}"></head>

<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="page">
        <div th:replace="~{fragments/layout :: messages}"></div>

        <h1>Garanties</h1>

        <p>
            <a class="btn" th:href="@{/agent/garanties/nouveau}">
                + Nouvelle garantie
            </a>
        </p>

        <table>
            <thead>
                <tr>
                    <th>Nom</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="g:${garanties}">
                    <td th:text="${g.nom}"></td>
                    <td th:text="${g.description}"></td>
                    <td>
                        <a th:href="@{/agent/garanties/{id}/modifier(id=${g.id})}">
                            Modifier
                        </a>

                        <form style="display:inline"
                              method="post"
                              th:action="@{/agent/garanties/{id}/supprimer(id=${g.id})}"
                              onsubmit="return confirm('Supprimer cette garantie ?')">
                            <button class="btn btn-danger">Supprimer</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>

<th:block th:replace="~{fragments/layout :: pied}"></th:block>
</body>

</html>
