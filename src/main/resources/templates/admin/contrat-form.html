<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Contrat')}"></head><body>
<header th:replace="~{fragments/layout :: header}"></header><main class="page"><div th:replace="~{fragments/layout :: messages}"></div><h1 th:text="${contrat.id == null ? 'Nouveau contrat' : 'Modifier le contrat'}"></h1>
<form th:action="@{/admin/contrats/enregistrer}" method="post"><input type="hidden" name="id" th:value="${contrat.id}"/>
<label>Numéro <input name="numeroContrat" required="required" maxlength="80" th:value="${contrat.numeroContrat}"/></label>
<label>Client <select name="clientId" required="required"><option value="">Choisir</option><option th:each="c : ${clients}" th:value="${c.id}" th:selected="${clientId != null ? clientId == c.id : contrat.client != null and contrat.client.id == c.id}" th:text="${c.prenom + ' ' + c.nom + ' — ' + c.email}"></option></select></label>
<label>Type d'assurance <select name="typeAssuranceId" required="required"><option value="">Choisir</option><option th:each="t : ${types}" th:value="${t.id}" th:selected="${typeAssuranceId != null ? typeAssuranceId == t.id : contrat.typeAssurance != null and contrat.typeAssurance.id == t.id}" th:text="${t.nom}"></option></select></label>
<label>Date de début <input type="date" name="dateDebut" required="required" th:value="${contrat.dateDebut}"/></label><label>Date de fin <input type="date" name="dateFin" th:value="${contrat.dateFin}"/></label>
<label>Prime <input type="number" name="prime" min="0.01" step="0.01" required="required" th:value="${contrat.prime}"/></label>
<label>Statut <select name="statut" required="required"><option th:each="s : ${statuts}" th:value="${s}" th:selected="${contrat.statut == s}" th:text="${s}"></option></select></label>
<button type="submit">Enregistrer</button> <a th:href="@{/admin/contrats}">Annuler</a></form></main>
<th:block th:replace="~{fragments/layout :: pied}"></th:block>
</body></html>
