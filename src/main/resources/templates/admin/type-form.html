<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Type d’assurance')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <div th:replace="~{fragments/layout :: messages}"></div>
    <h1 th:text="${type.id == null} ? 'Nouveau type' : 'Modifier le type'"></h1>

    <form th:action="@{/admin/types/enregistrer}" method="post">
        <input type="hidden" name="id" th:value="${type.id}">
        <p><label>Nom
            <input name="nom" maxlength="150" required th:value="${type.nom}"></label></p>
        <p><label>Description<br>
            <textarea name="description" rows="4" cols="50" th:text="${type.description}"></textarea></label></p>
        <p><label>Prix de base (€)
            <input name="prixBase" required
                   th:value="${prixSaisi != null} ? ${prixSaisi} : ${type.prixBase}"></label></p>
        <fieldset>
            <legend>Garanties disponibles</legend>
            <label th:each="g : ${garanties}" style="display:block">
                <input type="checkbox" name="garantieIds" th:value="${g.id}"
                       th:checked="${garantiesCochees != null}
                                   ? ${#lists.contains(garantiesCochees, g.id)}
                                   : ${type.garantiesDisponibles.contains(g)}">
                <span th:text="${g.nom}"></span>
            </label>
            <p th:if="${#lists.isEmpty(garanties)}">Aucune garantie en base. Crée-les d'abord côté agent.</p>
        </fieldset>
        <button type="submit">Enregistrer</button>
        <a th:href="@{/admin/types}">Annuler</a>
    </form>
</main>
</body>
</html>
