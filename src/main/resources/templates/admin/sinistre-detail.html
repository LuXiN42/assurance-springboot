<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Détail du sinistre')}"></head><body>
<header th:replace="~{fragments/layout :: header}"></header><main class="page"><div th:replace="~{fragments/layout :: messages}"></div><h1 th:text="${'Sinistre ' + sinistre.numeroSinistre}"></h1>
<dl><dt>Client</dt><dd th:text="${sinistre.contrat.client.prenom + ' ' + sinistre.contrat.client.nom}"></dd><dt>Contrat</dt><dd th:text="${sinistre.contrat.numeroContrat}"></dd><dt>Type</dt><dd th:text="${sinistre.typeSinistre}"></dd><dt>Date</dt><dd th:text="${#temporals.format(sinistre.date,'dd/MM/yyyy')}"></dd><dt>Description</dt><dd th:text="${sinistre.description}"></dd><dt>Montant estimé</dt><dd th:text="${sinistre.montantEstime}"></dd><dt>Statut actuel</dt><dd th:text="${sinistre.statut}"></dd><dt>Indemnisation</dt><dd th:text="${sinistre.montantIndemnisation}"></dd></dl>
<form th:action="@{/admin/sinistres/{id}/statut(id=${sinistre.id})}" method="post"><label>Nouveau statut <select name="statut"><option th:each="s : ${statuts}" th:value="${s}" th:selected="${sinistre.statut == s}" th:text="${s}"></option></select></label><button type="submit">Mettre à jour</button></form>
<form th:action="@{/admin/sinistres/{id}/supprimer(id=${sinistre.id})}" method="post" onsubmit="return confirm('Supprimer ce sinistre ?');"><button type="submit">Supprimer</button></form><p><a th:href="@{/admin/sinistres}">Retour à la liste</a></p>
</main>
<th:block th:replace="~{fragments/layout :: pied}"></th:block>
</body></html>
