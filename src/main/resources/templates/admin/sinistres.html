<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Sinistres')}"></head><body>
<header th:replace="~{fragments/layout :: header}"></header><main class="page"><div th:replace="~{fragments/layout :: messages}"></div><h1>Sinistres</h1>
<table><thead><tr><th>Numéro</th><th>Date</th><th>Client</th><th>Contrat</th><th>Montant estimé</th><th>Statut</th><th>Action</th></tr></thead><tbody>
<tr th:each="s : ${sinistres}"><td th:text="${s.numeroSinistre}"></td><td th:text="${#temporals.format(s.date,'dd/MM/yyyy')}"></td><td th:text="${s.contrat.client.prenom + ' ' + s.contrat.client.nom}"></td><td th:text="${s.contrat.numeroContrat}"></td><td th:text="${s.montantEstime}"></td><td th:text="${s.statut}"></td><td><a th:href="@{/admin/sinistres/{id}(id=${s.id})}">Détail / traiter</a></td></tr>
</tbody></table></main>
<th:block th:replace="~{fragments/layout :: pied}"></th:block>
</body></html>
