<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Sinistres')}"></head><body>
<header th:replace="~{fragments/layout :: header}"></header><main><div th:replace="~{fragments/layout :: messages}"></div><h1>Sinistres</h1>

<tr th:each="s : ${sinistres}"><td th:text="${s.numeroSinistre}"></td><td th:text="${#temporals.format(s.date,'dd/MM/yyyy')}"></td><td th:text="${s.contrat.client.prenom + ' ' + s.contrat.client.nom}"></td><td th:text="${s.contrat.numeroContrat}"></td><td th:text="${s.montantEstime}"></td><td th:text="${s.statut}"></td><td><a th:href="@{/admin/sinistres/{id}(id=${s.id})}">Détail / traiter</a></td></tr>
</tbody></table></main><script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/vce701823e78c4301a35b7e07294d87301792088814092" integrity="sha512-UKNk8GbxkABxKcXYuLkO16EleLGUkcvJWtpSNmExE0Too3ZaFAxTscNWEc1OdAv5/BikHawapSCaiD2XCmp+Bw==" data-cf-beacon='{"version":"2024.11.0","token":"8607d2a720d14b038279025b2b5a82e5","spa":2}' crossorigin="anonymous"></script>
</body></html>
