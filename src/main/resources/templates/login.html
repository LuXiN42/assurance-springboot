<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head-public('Connexion')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: header-sombre}"></th:block>

<main class="page-auth">
    <div class="aurore"><span></span><span></span><span></span></div>

    <div class="boite apparait d1">
        <h1>Bon retour !</h1>
        <p class="sous">Connectez-vous pour retrouver votre espace.</p>

        <p class="alerte ok" th:if="${inscriptionOk}">Compte créé, vous pouvez vous connecter.</p>
        <p class="alerte ok" th:if="${param.deconnecte}">Vous êtes déconnecté.</p>
        <p class="alerte ko" th:if="${param.erreur}">Email ou mot de passe incorrect.</p>

        <form th:action="@{/login}" method="post">
            <label>Email
                <input type="email" name="email" required autofocus>
            </label>
            <label>Mot de passe
                <input type="password" name="motDePasse" required>
            </label>
            <button type="submit">Se connecter</button>
        </form>

        <p class="bas-boite">Pas encore de compte ? <a th:href="@{/inscription}">Créer un compte</a></p>
    </div>
</main>

<script th:src="@{/js/bcare.js}"></script>
</body>
</html>
