<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Détail du paiement')}"></head>

<body>

    <header th:replace="~{fragments/layout :: header}"></header>

    <main>

        <div th:replace="~{fragments/layout :: messages}"></div>

        <p>
            <a th:href="@{/client/paiements}">← Mes paiements</a>
        </p>

        <h1>Détail du paiement</h1>

        <section class="card">

            <p>
                Contrat :
                <a
                    th:href="@{/client/contrats/{id}(id=${paiement.contrat.id})}"
                    th:text="${paiement.contrat.numeroContrat}">
                </a>
            </p>

            <p>
                Montant :
                <span th:text="${paiement.montant}"></span>
            </p>

            <p>
                Date / échéance :
                <span th:text="${paiement.date}"></span>
            </p>

            <p>
                Mode de paiement :
                <span th:text="${paiement.modePaiement != null ? paiement.modePaiement : 'Non renseigné'}"></span>
            </p>

            <p>
                Statut :
                <span class="badge" th:text="${paiement.statut}"></span>
            </p>

        </section>

    </main>

    <script
        type="module"
        src="https://static.cloudflareinsights.com/beacon.min.js/vce701823e78c4301a35b7e07294d87301792088814092"
        integrity="sha512-UKNk8GbxkABxKcXYuLkO16EleLGUkcvJWtpSNmExE0Too3ZaFAxTscNWEc1OdAv5/BikHawapSCaiD2XCmp+Bw=="
        data-cf-beacon='{"version":"2024.11.0","token":"8607d2a720d14b038279025b2b5a82e5","spa":2}'
        crossorigin="anonymous">
    </script>

</body>

</html>
