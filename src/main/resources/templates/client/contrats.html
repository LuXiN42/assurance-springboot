<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Mes contrats')}"></head>

<body>

    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="page">

        <div th:replace="~{fragments/layout :: messages}"></div>

        <h1>Mes contrats</h1>

        <p th:if="${#lists.isEmpty(contrats)}">
            Aucun contrat associé à votre compte.
        </p>

        <table th:unless="${#lists.isEmpty(contrats)}">

            <thead>
                <tr>
                    <th>Numéro</th>
                    <th>Type d'assurance</th>
                    <th>Début</th>
                    <th>Fin</th>
                    <th>Prime</th>
                    <th>Statut</th>
                    <th></th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="contrat : ${contrats}">
                    <td th:text="${contrat.numeroContrat}"></td>
                    <td th:text="${contrat.typeAssurance.nom}"></td>
                    <td th:text="${contrat.dateDebut}"></td>
                    <td th:text="${contrat.dateFin != null ? contrat.dateFin : '-'}"></td>
                    <td th:text="${contrat.prime}"></td>

                    <td>
                        <span
                            class="badge"
                            th:text="${contrat.statut}">
                        </span>
                    </td>

                    <td>
                        <a th:href="@{/client/contrats/{id}(id=${contrat.id})}">
                            Détail
                        </a>
                    </td>
                </tr>
            </tbody>

        </table>

    </main>


<th:block th:replace="~{fragments/layout :: pied}"></th:block>
</body>

</html>
