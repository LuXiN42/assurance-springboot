<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Mes contrats')}"></head>

<body>

    <header th:replace="~{fragments/layout :: header}"></header>

    <main>

        <div th:replace="~{fragments/layout :: messages}"></div>

        <h1>Mes contrats</h1>

        <p th:if="${#lists.isEmpty(contrats)}">
            Aucun contrat associé à votre compte.
        </p>

        <table th:unless="${#lists.isEmpty(contrats)}">

            <thead>
                <tr>
                    <th>Numéro</th>
                    <th>Type d'assurance</th>
                    <th>Début</th>
                    <th>Fin</th>
                    <th>Prime</th>
                    <th>Statut</th>
                    <th></th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="contrat : ${contrats}">
                    <td th:text="${contrat.numeroContrat}"></td>
                    <td th:text="${contrat.typeAssurance.nom}"></td>
                    <td th:text="${contrat.dateDebut}"></td>
                    <td th:text="${contrat.dateFin != null ? contrat.dateFin : '—'}"></td>
                    <td th:text="${contrat.prime}"></td>

                    <td>
                        <span
                            class="badge"
                            th:text="${contrat.statut}">
                        </span>
                    </td>

                    <td>
                        <a th:href="@{/client/contrats/{id}(id=${contrat.id})}">
                            Détail
                        </a>
                    </td>
                </tr>
            </tbody>

        </table>

    </main>

    <script
        type="module"
        src="https://static.cloudflareinsights.com/beacon.min.js/vce701823e78c4301a35b7e07294d87301792088814092"
        integrity="sha512-UKNk8GbxkABxKcXYuLkO16EleLGUkcvJWtpSNmExE0Too3ZaFAxTscNWEc1OdAv5/BikHawapSCaiD2XCmp+Bw=="
        data-cf-beacon='{"version":"2024.11.0","token":"8607d2a720d14b038279025b2b5a82e5","spa":2}'
        crossorigin="anonymous">
    </script>

</body>

</html>
