<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Mes sinistres')}"></head>

<body>

    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="page">

        <div th:replace="~{fragments/layout :: messages}"></div>

        <h1>Mes sinistres</h1>

        <p>
            <a class="btn" th:href="@{/client/sinistres/nouveau}">
                + Déclarer un sinistre
            </a>
        </p>

        <p th:if="${#lists.isEmpty(sinistres)}">
            Aucune déclaration enregistrée.
        </p>

        <table th:unless="${#lists.isEmpty(sinistres)}">

            <thead>
                <tr>
                    <th>Numéro</th>
                    <th>Date</th>
                    <th>Contrat</th>
                    <th>Type</th>
                    <th>Statut</th>
                    <th></th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="sinistre : ${sinistres}">
                    <td th:text="${sinistre.numeroSinistre}"></td>
                    <td th:text="${sinistre.date}"></td>
                    <td th:text="${sinistre.contrat.numeroContrat}"></td>

                    <td th:text="${sinistre.typeSinistre != null ? sinistre.typeSinistre : '-'}"></td>

                    <td>
                        <span
                            class="badge"
                            th:text="${sinistre.statut}">
                        </span>
                    </td>

                    <td>
                        <a th:href="@{/client/sinistres/{id}(id=${sinistre.id})}">
                            Suivre
                        </a>
                    </td>
                </tr>
            </tbody>

        </table>

    </main>


<th:block th:replace="~{fragments/layout :: pied}"></th:block>
</body>

</html>
