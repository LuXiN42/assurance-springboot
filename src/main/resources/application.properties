spring.application.name=assurance-springboot

# Base de données MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/assurance_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=assurance
spring.datasource.password=Assurance2026!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081
# Upload de pièces justificatives
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=52MB
app.upload.dir=uploads

# Clé Gemini pour Bibi, rangée dans ia.properties (fichier ignoré par Git)
spring.config.import=optional:classpath:ia.properties
